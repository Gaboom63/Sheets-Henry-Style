<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js" type="module"></script>
</head>
<body>

    <div id="auth-container" class="overlay">
        <div class="glass-card">
            <h2>Welcome Back</h2>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="login-btn" class="primary-btn">Sign In</button>
        </div>
    </div>

    <div id="name-container" class="overlay hidden">
        <div class="glass-card">
            <h2>What do you want to be called?</h2>
            <input type="text" id="display-name-input" placeholder="Your Name">
            <button id="save-name-btn" class="primary-btn">Save Name</button>
        </div>
    </div>

    <div id="room-container" class="overlay hidden">
        <div class="glass-card">
            <h2>Join a Room</h2>
            <input type="text" id="room-input" placeholder="e.g. SecretRoom123">
            <button id="join-room-btn" class="primary-btn">Enter Room</button>
        </div>
    </div>

    <div id="camera-modal" class="overlay hidden">
        <div class="glass-card" style="text-align: center;">
            <h2>Say Hi! 👋</h2>
            <video id="camera-feed" autoplay playsinline style="width:100%; border-radius: 8px; margin-bottom: 12px; background: #000;"></video>
            <canvas id="camera-canvas" class="hidden"></canvas>
            <div class="modal-buttons" style="justify-content: center;">
                <button id="close-camera-btn" class="secondary-btn">Cancel</button>
                <button id="snap-btn" class="primary-btn">📸 Snap & Send</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="overlay hidden">
        <div class="glass-card">
            <h2>Settings</h2>
            
            <div class="setting-group">
                <label>Change Your Name</label>
                <input type="text" id="setting-name">
            </div>

            <div class="setting-group">
                <label>Font Family</label>
                <select id="setting-font">
    <option value="system-ui, sans-serif">Standard</option>
    <option value="'OpenDyslexic', sans-serif">Dyslexia Friendly</option>
    <option value="'Montserrat', sans-serif">Montserrat</option>
    <option value="'Times New Roman', serif">Times New Roman</option>
    <option value="'Courier New', monospace">Typewriter</option>
            </select>
            </div>

            <div class="setting-group">
                <label>Message Size (<span id="size-label">16px</span>)</label>
                <input type="range" id="setting-size" min="12" max="28" value="16" style="width: 100%;">
            </div>

            <div class="checkbox-group" style="display:flex; gap: 10px; margin-bottom: 10px;">
                <label><input type="checkbox" id="setting-bold"> <b>Bold text</b></label>
                <label><input type="checkbox" id="setting-italic"> <i>Italic text</i></label>
            </div>

            <div class="setting-group">
                <label>App Color</label>
                <input type="color" id="setting-color" value="#ff6b6b">
            </div>

            <div class="checkbox-group" style="margin-bottom: 24px;">
                <input type="checkbox" id="setting-capitalize" checked>
                <label>Auto-Capitalize First Letter</label>
            </div>

            <div style="border-top: 1px solid var(--card-bg); margin: 20px 0;"></div>

            <div class="setting-group" style="margin-bottom: 15px;">
    <label for="setting-imgbb-key">ImgBB API Key (For Photos):</label>
    <input type="password" id="setting-imgbb-key" placeholder="Paste your key here..." style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            
            <button id="req-clear-btn" class="primary-btn" style="background: #e06c75; width: 100%; margin-bottom: 12px;">⚠️ Clear Chat (Both must click)</button>
        
            <div class="modal-buttons">
                <button id="close-settings-btn" class="secondary-btn">Cancel</button>
                <button id="save-settings-btn" class="primary-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <main class="chat-area">
            <header class="header-bar chat-header">
                <div>
                    <h3 id="room-title">Messaging Room</h3>
                    <div id="room-time">--:--</div>
                    <div id="countdown-timer" style="font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-top: 4px;">
                        ⏳ Clearing in 24 Hours
                    </div>
                </div>
                <button id="settings-btn" class="secondary-btn">⚙️ Settings</button>
            </header>
            
            <div id="chat-messages" class="messages-stream"></div>
            
            <div id="typing-indicator" class="typing-indicator-inline hidden">
                <span id="typing-name" class="msg-sender" style="margin: 0;"></span>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
            
            <div class="chat-input-bar">
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <button id="emoji-btn" class="icon-btn">😊</button>
                <emoji-picker id="emoji-picker" class="hidden" style="position: absolute; bottom: 80px;"></emoji-picker>
                <button id="upload-btn" class="icon-btn" title="Send Picture">🖼️</button>
                <button id="camera-btn" class="icon-btn" title="Take Photo">📷</button>
                <button id="video-call-btn" class="icon-btn" title="Video Call">🎥</button>
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" class="primary-btn">Send</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
